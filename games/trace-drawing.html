<!DOCTYPE html>
<html lang="en">

<link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTIiIGZpbGw9IiMxMTExMTQiLz48cmVjdCB4PSIxMiIgeT0iMTAiIHdpZHRoPSIzNCIgaGVpZ2h0PSI0NCIgcng9IjMiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzZmNmY3YSIgc3Ryb2tlLXdpZHRoPSIzIiBzdHJva2UtZGFzaGFycmF5PSI2IDUiLz48cGF0aCBkPSJNMjAgNDJjNC0xMiA5LTE4IDE0LTE4czcgNSA0IDktOCAyLTYtNSA4LTEyIDE0LTEyIiBmaWxsPSJub25lIiBzdHJva2U9IiNmMmYyZjQiIHN0cm9rZS13aWR0aD0iMy41IiBzdHJva2UtbGluZWNhcD0icm91bmQiLz48cGF0aCBkPSJNNDQgNDBsMTEgMTEtNiAxLTEtNnoiIGZpbGw9IiNmMmYyZjQiLz48L3N2Zz4K">
<title>Trace drawing</title>
<meta name="emoji" content="✏️">
<style>
  :root { --ui: rgba(20,20,22,.72); --fg: #f2f2f4; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--fg);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; overscroll-behavior: none;
  }
  #cam, #stage { position: fixed; inset: 0; width: 100%; height: 100%; }
  #cam { object-fit: cover; background: #000; }
  #stage { touch-action: none; }
  #overlay {
    position: absolute; top: 50%; left: 50%; max-width: none;
    transform-origin: center center; will-change: transform;
    pointer-events: none; display: none;
  }

  /* intro / permission gate */
  #intro {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; padding: 28px;
    text-align: center; background: #0b0b0d; z-index: 30;
  }
  #intro h1 { font-size: 22px; font-weight: 600; margin: 0; }
  #intro p { margin: 0; max-width: 32ch; color: #a8a8b0; font-size: 14px; }
  .big {
    appearance: none; border: 0; border-radius: 999px; padding: 14px 28px;
    font-size: 16px; font-weight: 600; color: #111; background: #f2f2f4; cursor: pointer;
  }

  /* controls */
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 8px;
    background: linear-gradient(to top, rgba(0,0,0,.6), transparent);
    transition: opacity .2s; 
  }
  #bar.hidden { opacity: 0; pointer-events: none; }
  button.pill {
    appearance: none; border: 0; border-radius: 10px; padding: 10px 12px;
    background: var(--ui); color: var(--fg); font-size: 14px; cursor: pointer;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    white-space: nowrap;
  }
  button.pill[aria-pressed="true"] { background: #f2f2f4; color: #111; }
  #fade {
    flex: 1; min-width: 60px; height: 38px; margin: 0 2px;
    background: var(--ui); border-radius: 10px; padding: 0 10px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    display: flex; align-items: center;
  }
  #fade input { width: 100%; accent-color: #f2f2f4; }
  #hint {
    position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top));
    transform: translateX(-50%); z-index: 20;
    background: var(--ui); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 8px 14px; border-radius: 999px; font-size: 13px; color: #d8d8de;
    transition: opacity .4s; pointer-events: none; max-width: 86vw; text-align: center;
  }
  #hint.gone { opacity: 0; }
  #unlock {
    position: fixed; z-index: 25; display: none;
    right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
    appearance: none; border: 0; border-radius: 10px; padding: 10px 14px;
    background: rgba(20,20,22,.5); color: #e8e8ee; font-size: 14px; cursor: pointer;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  #unlock.show { display: block; }
  #file { display: none; }
</style>
</head>
<body>

<video id="cam" playsinline autoplay muted></video>
<div id="stage"><img id="overlay" alt=""></div>

<div id="hint" class="gone"></div>
<button id="unlock">Unlock</button>

<div id="bar" hidden>
  <button class="pill" id="pick">Image</button>
  <div id="fade"><input type="range" id="alpha" min="5" max="100" value="45"></div>
  <button class="pill" id="lock" aria-pressed="false">Lock</button>
  <button class="pill" id="reset">Reset</button>
</div>

<div id="intro">
  <h1>Trace</h1>
  <p>Pick a picture, prop your phone above a blank sheet of paper, line the image up over the camera view, and draw what you see on screen.</p>
  <button class="big" id="start">Start camera</button>
  <p id="err" style="color:#ff8080"></p>
</div>

<input type="file" id="file" accept="image/*">

<script>
(function () {
  'use strict';

  var cam = document.getElementById('cam');
  var overlay = document.getElementById('overlay');
  var stage = document.getElementById('stage');
  var bar = document.getElementById('bar');
  var hint = document.getElementById('hint');
  var fileInput = document.getElementById('file');

  var t = { x: 0, y: 0, scale: 1, rot: 0 };
  var locked = false;
  var wakeLock = null;

  function apply() {
    overlay.style.transform =
      'translate(-50%, -50%) translate(' + t.x + 'px,' + t.y + 'px) ' +
      'rotate(' + t.rot + 'deg) scale(' + t.scale + ')';
  }

  var hintTimer;
  function say(msg, ms) {
    hint.textContent = msg;
    hint.classList.remove('gone');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function () { hint.classList.add('gone'); }, ms || 2600);
  }

  /* ---------- camera ---------- */

  function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      fail('This browser does not expose a camera API. Needs a modern browser over HTTPS.');
      return;
    }
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    }).then(function (stream) {
      cam.srcObject = stream;
      return cam.play();
    }).then(function () {
      document.getElementById('intro').remove();
      bar.hidden = false;
      requestWakeLock();
      say('Pick an image, then drag to move, pinch to zoom and rotate.', 5000);
    }).catch(function (e) {
      if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) {
        fail('Camera permission denied. Allow it in site settings and reload.');
      } else if (e && e.name === 'NotFoundError') {
        fail('No camera found on this device.');
      } else {
        fail('Could not start the camera: ' + (e && e.name ? e.name : 'unknown error'));
      }
    });
  }

  function fail(msg) { document.getElementById('err').textContent = msg; }

  /* ---------- keep the screen awake ---------- */

  function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function (l) {
      wakeLock = l;
      l.addEventListener('release', function () { wakeLock = null; });
    }).catch(function () { /* denied or low battery, not fatal */ });
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && !wakeLock) requestWakeLock();
  });

  /* ---------- image loading ---------- */

  document.getElementById('pick').addEventListener('click', function () { fileInput.click(); });

  fileInput.addEventListener('change', function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    var url = URL.createObjectURL(f);
    overlay.onload = function () {
      // fit to roughly 80% of the short side of the viewport
      var fit = Math.min(
        innerWidth * 0.8 / overlay.naturalWidth,
        innerHeight * 0.8 / overlay.naturalHeight
      );
      t.x = 0; t.y = 0; t.rot = 0; t.scale = fit > 0 ? fit : 1;
      overlay.style.display = 'block';
      apply();
      URL.revokeObjectURL(url);
    };
    overlay.src = url;
  });

  /* ---------- opacity ---------- */

  var alpha = document.getElementById('alpha');
  function setAlpha() { overlay.style.opacity = alpha.value / 100; }
  alpha.addEventListener('input', setAlpha);
  setAlpha();

  /* ---------- lock / reset ---------- */

  var lockBtn = document.getElementById('lock');
  var unlockBtn = document.getElementById('unlock');

  function setLock(v) {
    locked = v;
    start = null;
    lockBtn.setAttribute('aria-pressed', String(locked));
    lockBtn.textContent = locked ? 'Locked' : 'Lock';
    bar.classList.toggle('hidden', locked);
    unlockBtn.classList.toggle('show', locked);
    say(locked ? 'Locked. Tap Unlock, or double tap the screen.' : 'Unlocked.');
  }

  lockBtn.addEventListener('click', function () { setLock(true); });
  unlockBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    setLock(false);
  });

  document.getElementById('reset').addEventListener('click', function () {
    if (!overlay.src) return;
    var fit = Math.min(
      innerWidth * 0.8 / overlay.naturalWidth,
      innerHeight * 0.8 / overlay.naturalHeight
    );
    t.x = 0; t.y = 0; t.rot = 0; t.scale = fit > 0 ? fit : 1;
    apply();
  });

  /* double tap unlocks, so a locked overlay cannot trap the user.
     bound on document with pointer events so it still fires while locked */
  var lastTap = 0, lastX = 0, lastY = 0;
  document.addEventListener('pointerup', function (e) {
    if (!locked || e.pointerType === 'mouse') return;
    var now = Date.now();
    if (now - lastTap < 450 && Math.hypot(e.clientX - lastX, e.clientY - lastY) < 50) {
      setLock(false);
      lastTap = 0;
      return;
    }
    lastTap = now; lastX = e.clientX; lastY = e.clientY;
  });

  /* ---------- gestures ---------- */

  var start = null;

  function pair(touches) {
    var a = touches[0], b = touches[1];
    var dx = b.clientX - a.clientX, dy = b.clientY - a.clientY;
    return {
      cx: (a.clientX + b.clientX) / 2,
      cy: (a.clientY + b.clientY) / 2,
      dist: Math.hypot(dx, dy),
      ang: Math.atan2(dy, dx) * 180 / Math.PI
    };
  }

  stage.addEventListener('touchstart', function (e) {
    if (overlay.style.display !== 'block') return;
    e.preventDefault();  /* also while locked, so the browser cannot claim the taps */
    if (locked) return;
    if (e.touches.length === 1) {
      start = { mode: 1, x: e.touches[0].clientX, y: e.touches[0].clientY, t: { x: t.x, y: t.y } };
    } else if (e.touches.length === 2) {
      start = { mode: 2, p: pair(e.touches), t: { x: t.x, y: t.y, scale: t.scale, rot: t.rot } };
    }
  }, { passive: false });

  stage.addEventListener('touchmove', function (e) {
    if (locked || !start) return;
    e.preventDefault();

    if (start.mode === 1 && e.touches.length === 1) {
      t.x = start.t.x + (e.touches[0].clientX - start.x);
      t.y = start.t.y + (e.touches[0].clientY - start.y);
      apply();
    } else if (start.mode === 2 && e.touches.length === 2) {
      var p = pair(e.touches);
      var k = p.dist / start.p.dist;
      t.scale = Math.min(20, Math.max(0.05, start.t.scale * k));
      t.rot = start.t.rot + (p.ang - start.p.ang);
      /* pan with the midpoint so the gesture stays anchored under the fingers */
      t.x = start.t.x + (p.cx - start.p.cx);
      t.y = start.t.y + (p.cy - start.p.cy);
      apply();
    }
  }, { passive: false });

  function endTouch(e) {
    if (!e.touches.length) start = null;
    else if (e.touches.length === 1) {
      start = { mode: 1, x: e.touches[0].clientX, y: e.touches[0].clientY, t: { x: t.x, y: t.y } };
    }
  }
  stage.addEventListener('touchend', endTouch);
  stage.addEventListener('touchcancel', endTouch);

  /* mouse fallback, handy for testing on a laptop */
  var dragging = false, mStart = null;
  stage.addEventListener('mousedown', function (e) {
    if (locked || overlay.style.display !== 'block') return;
    dragging = true;
    mStart = { x: e.clientX, y: e.clientY, t: { x: t.x, y: t.y } };
  });
  addEventListener('mousemove', function (e) {
    if (!dragging) return;
    t.x = mStart.t.x + (e.clientX - mStart.x);
    t.y = mStart.t.y + (e.clientY - mStart.y);
    apply();
  });
  addEventListener('mouseup', function () { dragging = false; });
  stage.addEventListener('wheel', function (e) {
    if (locked || overlay.style.display !== 'block') return;
    e.preventDefault();
    t.scale = Math.min(20, Math.max(0.05, t.scale * (e.deltaY < 0 ? 1.06 : 1 / 1.06)));
    apply();
  }, { passive: false });

  /* stop iOS rubber banding and pinch zoom of the page itself */
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('touchmove', function (e) {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  document.getElementById('start').addEventListener('click', startCamera);
})();
</script>
</body>
</html>
